<body>
<main class="wrap">
  <div class="eyebrow">免費小工具</div>
  <h1>提要求練習器</h1>
  <p class="lead">很多話不是不能說，是說的方式讓他只聽到責怪。先給畫面，再給感受，最後才給一個小小的要求，他比較聽得進去。</p>

  <div class="box">
    <p class="q">1. 妳想要他做什麼？</p>
    <div class="opts" id="want">
      <button class="opt" data-v="0">忙的時候先說一聲</button><button class="opt" data-v="1">多陪我一點</button><button class="opt" data-v="2">約會換他安排</button><button class="opt" data-v="3">記得重要的日子</button><button class="opt" data-v="4">吵架不要冷戰</button><button class="opt" data-v="5">我自己寫</button>
    </div>
    <div id="own" style="display:none">
      <p class="q">畫面：發生了什麼事？（寫事實，不寫他的錯）</p>
      <input type="text" id="o1" placeholder="例：今天下午在沙發上等你訊息，等到睡著了">
      <p class="q" style="margin-top:14px">要求：妳希望他下次怎麼做？（越小越好）</p>
      <input type="text" id="o3" placeholder="例：下次忙的話先跟我說一聲">
    </div>
    <p class="q" style="margin-top:20px">2. 妳那時候的感受？</p>
    <div class="opts" id="feel"><button class="opt" data-v="有點失落">有點失落</button><button class="opt" data-v="有點委屈">有點委屈</button><button class="opt" data-v="有點不安">有點不安</button><button class="opt" data-v="很想你">很想你</button><button class="opt" data-v="有點孤單">有點孤單</button></div>
    <button class="go" id="go" disabled>產生我的那句話</button>
  </div>

  <div class="box" id="res"></div>

  <h2>延伸閱讀</h2>
  <div class="rel">
    <a href="/qa/ti-yao-qiu/">📖 跟男朋友提要求會被嫌煩嗎？3 個讓他願意做的開口方法</a>
    <a href="/make-up/">🤝 吵架後第一句怎麼開口？和好開場白產生器</a>
    <a href="/read-no-reply/">⏳ 已讀不回多久算正常？30 秒檢測</a>
  </div>
  <p class="note">產生的句子是一個起點，換成妳自己平常說話的口氣最好。他聽得出來是不是妳的話。</p>
</main>
<script>
var P=[
 {s:'今天等你訊息等了一整個下午',r:'下次忙的話先跟我說一聲好嗎？我就不會一直等了',no:'你為什麼都不回我？'},
 {s:'最近我們好像都各忙各的，晚上常常只有我一個人',r:'這週可以挑一個晚上，我們好好吃頓飯嗎？',no:'你都不陪我'},
 {s:'這幾次約會都是我在查餐廳、想行程',r:'下次換你安排好不好？去哪裡都可以，我想被你帶著走',no:'為什麼每次都要我想？'},
 {s:'那天是我們的紀念日，我一直在等你說點什麼',r:'下次可以一起記得嗎？不用很隆重，一句話我就很開心',no:'你連這個都忘記'},
 {s:'上次吵完，你好幾天沒跟我說話',r:'下次吵架可以先說「我需要冷靜一下」嗎？這樣我就知道你還在',no:'你又要冷戰了是不是？'}
];
var want=document.getElementById('want'),feel=document.getElementById('feel');
pick(want);pick(feel);
function ready(){
  var w=want.dataset.v,ok=w!==undefined&&feel.dataset.v!==undefined;
  if(w==='5')ok=ok&&document.getElementById('o1').value.trim()&&document.getElementById('o3').value.trim();
  document.getElementById('go').disabled=!ok;
}
window.onPick=function(){document.getElementById('own').style.display=want.dataset.v==='5'?'block':'none';ready()};
['o1','o3'].forEach(function(i){document.getElementById(i).addEventListener('input',ready)});
function esc(t){return t.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.getElementById('go').onclick=function(){
  var w=+want.dataset.v,f=feel.dataset.v,s,r,no,h='';
  if(w===5){s=esc(document.getElementById('o1').value.trim().replace(/[。，！？!?,.]+$/,''));r=esc(document.getElementById('o3').value.trim().replace(/[。！!.]+$/,''));no='';}
  else{s=P[w].s;r=P[w].r;no=P[w].no;}
  var line=s+'，我'+f+'。'+r+(w===5?(/[？?]$/.test(r)?'':'，好嗎？'):(/[？?。]$/.test(r)?'':'。'));
  h+='<p class="verdict">妳的那句話：</p>'+sayHTML(line);
  h+='<div class="sec"><b>為什麼這樣說比較好接</b><p>先講畫面，他會想像得到妳那時候的樣子；再講感受，他知道妳在意的是什麼；最後的要求很小，他做得到，也就比較願意做。</p></div>';
  if(no)h+='<div class="sec"><b>同一件事，這樣說容易變吵架</b><p>「'+no+'」聽起來是在追究，他會先想防守，妳真正想要的就被蓋過去了。</p></div>';
  h+='<div class="sec"><b>問問自己</b><p>這個要求，我以前是說出口了，還是一直等他自己發現？</p></div>';
  h+='<div class="cta"><p>開口了還是卡住？想聊聊妳在這段關係裡為什麼這麼難開口？<br>到官方 LINE 傳<span class="kw">開口</span>給我</p><a href="https://lin.ee/7TJ603O" target="_blank" rel="noopener">加官方 LINE</a></div>';
  h+='<div style="text-align:center"><button class="again" onclick="location.reload()">再練一句</button></div>';
  var res=document.getElementById('res');res.innerHTML=h;res.style.display='block';res.scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
