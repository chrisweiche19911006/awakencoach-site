<script>
var ids=['stage','usual','wait','last'];
ids.forEach(function(i){pick(document.getElementById(i))});
window.onPick=function(){document.getElementById('go').disabled=!ids.every(function(i){return document.getElementById(i).dataset.v!==undefined})};
function v(i){return +document.getElementById(i).dataset.v}
var SAY={
 0:['剛剛看到一個東西想到你，晚點有空再跟你說～','今天過得還好嗎？忙完再回我就好'],
 1:['你今天好像很忙，忙完記得吃飯喔','沒事，就是有點想你，忙完再聊'],
 2:['今天辛苦了，忙完再回我就好','晚上有空的話，想聽聽你今天過得怎樣'],
 3:['剛剛那樣講我也有點急，等你想聊的時候我們再好好說','我還是很在乎你，等你準備好再聊']
};
document.getElementById('go').onclick=function(){
  var s=v('stage'),u=v('usual'),w=v('wait'),l=v('last'),d=w-u,h='';
  var title,stay,todo;
  if(d<=0){title='這次的速度，跟他平常差不多。';stay='他在自己平常的節奏裡，現在比較需要照顧的，是妳等訊息時的那份不安。';}

  else{title='比他平常慢很多，妳會不安很正常。';stay='妳的感受是真的。但在問他之前，先讓自己穩下來，帶著情緒傳出去的訊息，常常會把對方推得更遠。';}
  if(l===3){todo='妳已經連傳好幾則了，接下來先不要再傳。讓訊息停在這裡，給他一點空間，也給自己一點空間。';}
  else if(l===2){todo='最後一則是情緒，他可能還不知道怎麼接。等妳平靜一點，再補一句輕鬆的話，讓他好接。';}
  else if(l===1){todo='問題型的訊息，有些人需要想一下才回。可以把問題變簡單一點，或改天見面再問。';}
  else{todo='分享日常本來就不一定需要馬上回。不用追問，繼續過妳自己的生活，有新的事再分享就好。';}
  if(s===3&&d>=1)todo+=' 剛吵完架的已讀不回，很多時候是他還在消化情緒，先不要逼他表態。';
  var says=SAY[s];
  h+='<p class="verdict">'+title+'</p>';
  h+='<div class="sec"><b>先穩住自己</b><p>'+stay+'</p></div>';
  h+='<div class="sec"><b>現在可以做的一件事</b><p>'+todo+'</p></div>';
  h+='<div class="sec"><b>真的想傳的話，可以這樣說</b>'+(l===3?'<p>這次建議先不傳。如果明天他還是沒動靜，再用下面這句：</p>':'')+sayHTML(says[0])+sayHTML(says[1])+'</div>';

};
