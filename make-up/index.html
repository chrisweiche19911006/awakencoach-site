    no:'「你就是比較在乎他們」',ask:'這件事裡，我真正需要的是什麼？是被支持，還是被選擇？'}
};
var NOW=['先給彼此半天到一天冷靜，再用第一句開口。氣頭上說的話，很容易變成下一場架。','一兩天剛好，氣都消得差不多了，現在開口最容易接住。','冷了好幾天，第一句就更要輕。不急著把事情講完，先讓他願意回妳就好。'];
